[build]
  # Keep default build command unless overridden in Netlify UI.
  command = "npm run build"

[build.environment]
  # These NEXT_PUBLIC_* values are intended to be public and are inlined by Next.js.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  NODE_OPTIONS = "--max-old-space-size=4096"
